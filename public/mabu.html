<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MABU ADMIN DASHBOARD - Risk2Data</title>
    <style>
        :root {
            --bg: #0b0e13;
            --panel: #11161f;
            --border: #222938;
            --accent: #4c82e6;
            --danger: #e05252;
            --success: #3eb97e;
            --text: #e1e7f0;
            --muted: #7d8b9e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }
        header {
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel);
        }
        h1 { font-size: 1.25rem; letter-spacing: 0.1em; font-weight: 800; color: var(--accent); }
        .nav-link { color: var(--muted); text-decoration: none; font-size: 0.8rem; font-weight: 600; border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 4px; transition: all 0.2s; }
        .nav-link:hover { border-color: var(--accent); color: var(--text); }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
        input, select, textarea {
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.75rem;
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }
        textarea { resize: vertical; min-height: 150px; }

        .btn-group { display: flex; gap: 1rem; margin-top: 1rem; }
        button {
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-size: 0.85rem;
        }
        .btn-primary { background-color: var(--accent); color: white; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-secondary { background-color: transparent; border: 1px solid var(--border); color: var(--muted); }
        .btn-secondary:hover { border-color: var(--muted); color: var(--text); }

        #status-msg { font-size: 0.8rem; margin-top: 0.5rem; padding: 0.5rem; border-radius: 4px; display: none; }
        .status-success { background-color: rgba(62, 185, 126, 0.1); border: 1px solid var(--success); color: var(--success); }
        .status-error { background-color: rgba(224, 82, 82, 0.1); border: 1px solid var(--danger); color: var(--danger); }

        .inventory-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .count-badge { background-color: var(--border); color: var(--accent); padding: 0.25rem 0.5rem; border-radius: 4px; font-weight: 800; font-size: 0.75rem; }
        
        .record-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 700px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        .record-item {
            background-color: var(--bg);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .record-item h4 { font-size: 0.95rem; }
        .record-item .meta { font-size: 0.75rem; color: var(--muted); display: flex; gap: 1rem; }
        .record-item .actions { display: flex; gap: 1rem; margin-top: 0.5rem; }
        .action-btn { background: none; border: none; font-size: 0.75rem; font-weight: 700; cursor: pointer; padding: 0; }
        .edit-btn { color: var(--accent); }
        .delete-btn { color: var(--danger); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="login-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 2000;">
        <div class="card" style="width: 100%; max-width: 400px; padding: 2.5rem;">
            <h1 style="text-align: center; margin-bottom: 2rem;">ADMIN LOGIN</h1>
            <form id="admin-login-form" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="admin-username" required placeholder="Enter admin username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="admin-password" required placeholder="Enter admin password">
                </div>
                <div id="login-error" style="color: var(--danger); font-size: 0.8rem; text-align: center; display: none;">Invalid credentials</div>
                <button type="submit" class="btn-primary" style="width: 100%;">ACCESS DASHBOARD</button>
            </form>
            <div style="margin-top: 1.5rem; text-align: center;">
                <a href="/" style="color: var(--muted); text-decoration: none; font-size: 0.8rem;">← Back to Portal</a>
            </div>
        </div>
    </div>

    <div id="admin-content" style="display: none;">
        <header>
            <h1>MABU ADMIN DASHBOARD</h1>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <div id="admin-tabs" style="display: flex; gap: 0.5rem;">
                <button class="nav-link active-tab" onclick="switchTab('inventory')">INVENTORY</button>
                <button class="nav-link" onclick="switchTab('clients')">CLIENT ACCOUNTS</button>
                <button class="nav-link" onclick="switchTab('requests')">DEMO REQUESTS</button>
                <button class="nav-link" onclick="switchTab('access-logs')">ACCESS LOGS</button>
            </div>
            <button class="nav-link" onclick="logoutAdmin()" style="border-color: var(--danger); color: var(--danger);">LOGOUT</button>
            <a href="/" class="nav-link">← RETURN TO CLIENT PORTAL</a>
        </div>
    </header>

    <main>
        <!-- Form Column -->
        <section class="card" id="form-section">
            <h2 style="font-size: 1rem; margin-bottom: 0.5rem;">INGEST / EDIT RECORD</h2>
            <form id="record-form">
                <input type="hidden" id="record-id">
                
                <div class="form-group">
                    <label for="title">Title / Subject</label>
                    <input type="text" id="title" required placeholder="Enter entity name or subject">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="entity_type">Entity Type</label>
                        <select id="entity_type" required>
                            <option value="Security Actor">Security Actor</option>
                            <option value="Event">Event</option>
                            <option value="Armed Group">Armed Group</option>
                            <option value="Commander">Commander</option>
                            <option value="Militia Commander">Militia Commander</option>
                            <option value="Person">Person</option>
                            <option value="Family">Family</option>
                            <option value="Tribe">Tribe</option>
                            <option value="Location">Location</option>
                            <option value="Document">Document</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Regions (Multi-select)</label>
                        <div style="display: flex; gap: 1rem; padding: 0.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 4px;">
                            <label style="display: flex; align-items: center; gap: 0.4rem; text-transform: none; font-size: 0.75rem; cursor: pointer;">
                                <input type="checkbox" name="region" value="West"> West
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.4rem; text-transform: none; font-size: 0.75rem; cursor: pointer;">
                                <input type="checkbox" name="region" value="East"> East
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.4rem; text-transform: none; font-size: 0.75rem; cursor: pointer;">
                                <input type="checkbox" name="region" value="South"> South
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="tags">Tags (comma separated)</label>
                    <input type="text" id="tags" placeholder="e.g. Tripoli, Militia, High Priority">
                </div>

                <div class="form-group">
                    <label>Affiliations / Allies (Multi-select)</label>
                    <div id="affiliations-picker" style="max-height: 120px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; padding: 0.5rem; background: var(--bg); display: flex; flex-direction: column; gap: 0.5rem;">
                        <!-- Populate with existing entities -->
                    </div>
                </div>

                <div class="form-group">
                    <label>Rivalries / Opposition (Multi-select)</label>
                    <div id="rivalries-picker" style="max-height: 120px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; padding: 0.5rem; background: var(--bg); display: flex; flex-direction: column; gap: 0.5rem;">
                        <!-- Populate with existing entities -->
                    </div>
                </div>

                <div class="form-group">
                    <label for="summary">Intelligence Narrative</label>
                    <textarea id="summary" required placeholder="Detailed assessment and summary..."></textarea>
                </div>

                <div class="form-group">
                    <label>Linked Events</label>
                    <div id="linked-events-picker" style="max-height: 150px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; padding: 0.5rem; background: var(--bg); display: flex; flex-direction: column; gap: 0.5rem;">
                        <!-- Events populated here -->
                    </div>
                </div>

                <div id="status-msg"></div>

                <div class="btn-group">
                    <button type="submit" class="btn-primary" id="save-btn">SAVE RECORD</button>
                    <button type="button" class="btn-secondary" id="clear-btn">CLEAR FORM</button>
                </div>
            </form>
        </section>

        <!-- Inventory Column -->
        <section class="card" id="inventory-section">
            <div class="inventory-header">
                <h2 style="font-size: 1rem;">DATABASE INVENTORY</h2>
                <span class="count-badge" id="record-count">0 RECORDS</span>
            </div>
            
            <div class="form-group">
                <input type="text" id="filter" placeholder="Filter inventory by name or category...">
            </div>

            <div class="record-list" id="record-list">
                <!-- Records injected here -->
            </div>
        </section>

        <section class="card" id="clients-section" style="display: none;">
            <h2 id="client-form-title" style="font-size: 1rem; margin-bottom: 0.5rem;">CREATE CLIENT ACCOUNT</h2>
            <form id="client-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
                <input type="hidden" id="client-id">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="client-name">Client / Agency Name</label>
                        <input type="text" id="client-name" required placeholder="e.g. United Nations Support Mission">
                    </div>
                    <div class="form-group">
                        <label for="client-expiry">Account Expiry</label>
                        <select id="client-expiry" required>
                            <option value="1">1 Month</option>
                            <option value="2">2 Months</option>
                            <option value="3">3 Months</option>
                            <option value="6">6 Months</option>
                            <option value="12">12 Months (1 Year)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Region Access (Multi-select)</label>
                    <div style="display: flex; gap: 1.5rem; padding: 0.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 4px;">
                        <label style="display: flex; items-center; gap: 0.5rem; text-transform: none; font-weight: normal; cursor: pointer;">
                            <input type="checkbox" name="client-region" value="West" checked> West
                        </label>
                        <label style="display: flex; items-center; gap: 0.5rem; text-transform: none; font-weight: normal; cursor: pointer;">
                            <input type="checkbox" name="client-region" value="East" checked> East
                        </label>
                        <label style="display: flex; items-center; gap: 0.5rem; text-transform: none; font-weight: normal; cursor: pointer;">
                            <input type="checkbox" name="client-region" value="South" checked> South
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Entity Type Access (Multi-select)</label>
                    <div id="type-access-picker" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; padding: 0.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; max-height: 200px; overflow-y: auto;">
                        <!-- Types populated here -->
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="client-save-btn">GENERATE ACCESS KEY</button>
                <button type="button" class="btn-secondary" id="client-clear-btn" style="display: none;">CANCEL EDIT</button>
            </form>
        </section>

        <section class="card" id="client-list-section" style="display: none;">
            <div class="inventory-header">
                <h2 style="font-size: 1rem;">ACTIVE CLIENT ACCOUNTS</h2>
                <span class="count-badge" id="client-count">0 ACCOUNTS</span>
            </div>
            <div class="record-list" id="client-list">
                <!-- Clients injected here -->
            </div>
        </section>

        <!-- Demo Requests Column (Hidden by default) -->
        <section class="card" id="requests-section" style="display: none; grid-column: 1 / span 2;">
            <div class="inventory-header">
                <h2 style="font-size: 1rem;">DEMO REQUESTS</h2>
                <span class="count-badge" id="request-count">0 REQUESTS</span>
            </div>
            
            <div class="record-list" id="request-list">
                <!-- Requests injected here -->
            </div>
        </section>

        <!-- Access Logs Column (Hidden by default) -->
        <section class="card" id="access-logs-section" style="display: none; grid-column: 1 / span 2;">
            <div class="inventory-header">
                <h2 style="font-size: 1rem;">ACCESS LOGS</h2>
                <span class="count-badge" id="log-count">0 ENTRIES</span>
            </div>
            
            <div class="record-list" id="log-list">
                <!-- Logs injected here -->
            </div>
        </section>
    </main>

    <style>
        .active-tab {
            background-color: var(--accent) !important;
            color: white !important;
            border-color: var(--accent) !important;
        }
        .request-item, .client-item, .log-item {
            background-color: var(--bg);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .request-item h4, .client-item h4, .log-item h4 { color: var(--accent); font-size: 1.1rem; }
        .request-item .sender-info, .client-item .meta, .log-item .log-meta { display: flex; gap: 1.5rem; font-size: 0.8rem; color: var(--muted); }
        .request-item .message, .client-item .access-box, .log-item .regions-box { font-size: 0.9rem; line-height: 1.6; color: var(--text); background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 4px; }
        .access-key { font-family: monospace; font-weight: 800; color: var(--success); letter-spacing: 0.1em; background: rgba(62, 185, 126, 0.1); padding: 4px 8px; border-radius: 4px; }
        .log-badge { font-size: 0.7rem; font-weight: 800; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
        .badge-login { background: var(--accent); color: white; }
        .badge-access { background: var(--success); color: white; }

        /* Modal / Overlay for logs */
        #log-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 2rem;
        }
        .log-modal {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 100%;
            max-width: 800px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 2rem;
        }
    </style>

    <div id="log-overlay">
        <div class="log-modal">
            <div class="inventory-header">
                <h2 id="modal-title">CLIENT ACTIVITY LOGS</h2>
                <button class="action-btn delete-btn" onclick="closeLogModal()">CLOSE</button>
            </div>
            <div id="modal-log-list" class="record-list" style="margin-top: 1rem;">
                <!-- Filtered logs here -->
            </div>
        </div>
    </div>

    </div> <!-- End admin-content -->

    <script>
        let adminToken = localStorage.getItem('adminToken');

        async function adminFetch(url, options = {}) {
            const headers = {
                ...options.headers,
                'x-admin-token': adminToken
            };
            const res = await fetch(url, { ...options, headers });
            if (res.status === 401) {
                logoutAdmin();
                throw new Error('Unauthorized');
            }
            return res;
        }

        function logoutAdmin() {
            adminToken = null;
            localStorage.removeItem('adminToken');
            document.getElementById('login-overlay').style.display = 'flex';
            document.getElementById('admin-content').style.display = 'none';
        }

        document.getElementById('admin-login-form').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('admin-username').value;
            const password = document.getElementById('admin-password').value;
            const errorDiv = document.getElementById('login-error');

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    adminToken = data.token;
                    localStorage.setItem('adminToken', adminToken);
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('admin-content').style.display = 'block';
                    fetchRecords();
                } else {
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Server error';
                errorDiv.style.display = 'block';
            }
        };

        if (adminToken) {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
        }

        const form = document.getElementById('record-form');
        const list = document.getElementById('record-list');
        const countBadge = document.getElementById('record-count');
        const filterInput = document.getElementById('filter');
        const statusMsg = document.getElementById('status-msg');
        const recordIdInput = document.getElementById('record-id');
        const requestList = document.getElementById('request-list');
        const requestCountBadge = document.getElementById('request-count');
        const eventPicker = document.getElementById('linked-events-picker');
        const affiliationsPicker = document.getElementById('affiliations-picker');
        const rivalriesPicker = document.getElementById('rivalries-picker');
        
        const clientForm = document.getElementById('client-form');
        const clientIdInput = document.getElementById('client-id');
        const clientSaveBtn = document.getElementById('client-save-btn');
        const clientClearBtn = document.getElementById('client-clear-btn');
        const clientFormTitle = document.getElementById('client-form-title');
        
        const clientList = document.getElementById('client-list');
        const clientCountBadge = document.getElementById('client-count');
        const typeAccessPicker = document.getElementById('type-access-picker');

        const logList = document.getElementById('log-list');
        const logCountBadge = document.getElementById('log-count');

        let allRecords = [];
        let allRequests = [];
        let allClients = [];
        let allLogs = [];

        const ENTITY_TYPES = ["Security Actor", "Event", "Armed Group", "Commander", "Militia Commander", "Person", "Family", "Tribe", "Location", "Document"];

        function switchTab(tab) {
            const sections = {
                inventory: [document.getElementById('inventory-section'), document.getElementById('form-section')],
                clients: [document.getElementById('client-list-section'), document.getElementById('clients-section')],
                requests: [document.getElementById('requests-section')],
                'access-logs': [document.getElementById('access-logs-section')]
            };

            const tabs = document.querySelectorAll('#admin-tabs .nav-link');
            tabs.forEach(t => t.classList.remove('active-tab'));

            // Hide all
            Object.values(sections).forEach(group => group.forEach(s => s.style.display = 'none'));

            if (tab === 'inventory') {
                sections.inventory.forEach(s => s.style.display = 'flex');
                tabs[0].classList.add('active-tab');
                document.querySelector('main').style.gridTemplateColumns = '1fr 1fr';
                fetchRecords();
            } else if (tab === 'clients') {
                sections.clients.forEach(s => s.style.display = 'flex');
                tabs[1].classList.add('active-tab');
                document.querySelector('main').style.gridTemplateColumns = '1fr 1fr';
                fetchClients();
                renderTypePicker();
            } else if (tab === 'requests') {
                sections.requests.forEach(s => s.style.display = 'flex');
                tabs[2].classList.add('active-tab');
                document.querySelector('main').style.gridTemplateColumns = '1fr';
                fetchDemoRequests();
            } else if (tab === 'access-logs') {
                sections['access-logs'].forEach(s => s.style.display = 'flex');
                tabs[3].classList.add('active-tab');
                document.querySelector('main').style.gridTemplateColumns = '1fr';
                fetchAccessLogs();
            }
        }

        function getRemainingDuration(expiresAt) {
            const now = new Date();
            const exp = new Date(expiresAt);
            const diff = exp - now;
            if (diff <= 0) return 'EXPIRED';
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            if (days > 30) return Math.floor(days / 30) + ' Months remaining';
            return days + ' Days remaining';
        }

        async function fetchAccessLogs() {
            try {
                // We also need clients to calculate remaining duration
                const [logRes, clientRes] = await Promise.all([
                    adminFetch('/api/admin/access-logs'),
                    adminFetch('/api/admin/clients')
                ]);
                allLogs = await logRes.json();
                allClients = await clientRes.json();
                renderAccessLogs();
            } catch (err) {
                showStatus('Failed to load access logs', 'error');
            }
        }

        function renderAccessLogs() {
            logCountBadge.textContent = `${allLogs.length} ENTRIES`;
            logList.innerHTML = allLogs.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).map(l => {
                const client = allClients.find(c => c.id === l.client_id);
                const duration = client ? getRemainingDuration(client.expires_at) : 'N/A';
                const badgeClass = l.action === 'Login' ? 'badge-login' : 'badge-access';
                
                return `
                <div class="log-item">
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <div>
                            <span class="log-badge ${badgeClass}">${l.action}</span>
                            <h4 style="display: inline; margin-left: 1rem;">${l.client_name}</h4>
                        </div>
                        <span style="font-size: 0.7rem; color: var(--muted);">${new Date(l.timestamp).toLocaleString()}</span>
                    </div>
                    <div class="log-meta">
                        <span>🆔 ${l.client_id}</span>
                        <span style="color: ${duration === 'EXPIRED' ? 'var(--danger)' : 'var(--success)'}">⏳ ${duration}</span>
                    </div>
                    <div class="regions-box">
                        <small style="color: var(--muted); display: block; margin-bottom: 0.25rem; font-size: 0.7rem; text-transform: uppercase;">Regions Accessed:</small>
                        ${l.regions.length ? l.regions.join(', ') : 'None / Dashboard Only'}
                    </div>
                </div>
                `;
            }).join('');

            if (allLogs.length === 0) {
                logList.innerHTML = '<div style="text-align: center; color: var(--muted); padding: 3rem;">No access events recorded yet.</div>';
            }
        }

        function renderTypePicker() {
            typeAccessPicker.innerHTML = ENTITY_TYPES.map(type => `
                <label style="display: flex; items-center; gap: 0.5rem; text-transform: none; font-weight: normal; cursor: pointer;">
                    <input type="checkbox" name="client-type" value="${type}" checked> ${type}
                </label>
            `).join('');
        }

        async function fetchRecords() {
            try {
                const res = await adminFetch('/api/admin/records');
                allRecords = await res.json();
                renderRecords();
            } catch (err) {
                showStatus('Failed to load records', 'error');
            }
        }

        async function fetchClients() {
            try {
                const res = await adminFetch('/api/admin/clients');
                allClients = await res.json();
                renderClients();
            } catch (err) {
                showStatus('Failed to load clients', 'error');
            }
        }

        async function fetchDemoRequests() {
            try {
                const res = await adminFetch('/api/admin/demo-requests');
                allRequests = await res.json();
                renderRequests();
            } catch (err) {
                showStatus('Failed to load demo requests', 'error');
            }
        }

        function renderRecords() {
            const filter = filterInput.value.toLowerCase();
            const filtered = allRecords.filter(r => 
                r.title.toLowerCase().includes(filter) || 
                r.entity_type.toLowerCase().includes(filter)
            );

            countBadge.textContent = `${allRecords.length} RECORDS`;
            list.innerHTML = filtered.map(r => `
                <div class="record-item">
                    <h4>${r.title}</h4>
                    <div class="meta">
                        <span>TYPE: ${r.entity_type}</span>
                        <span>REGIONS: ${r.regions.join(', ')}</span>
                        <span>ID: ${r.id}</span>
                    </div>
                    <div class="actions">
                        <button class="action-btn edit-btn" onclick="editRecord('${r.id}')">EDIT</button>
                        <button class="action-btn delete-btn" onclick="deleteRecord('${r.id}')">DELETE</button>
                    </div>
                </div>
            `).join('');

            const nonEvents = allRecords.filter(r => r.entity_type !== 'Event');
            const entitiesList = nonEvents.map(e => `
                <label style="display: flex; align-items: center; gap: 0.5rem; text-transform: none; font-weight: normal; cursor: pointer;">
                    <input type="checkbox" class="aff-checkbox" value="${e.title}">
                    <span style="font-size: 0.8rem;">${e.title}</span>
                </label>
            `).join('');
            
            const rivalriesList = nonEvents.map(e => `
                <label style="display: flex; align-items: center; gap: 0.5rem; text-transform: none; font-weight: normal; cursor: pointer;">
                    <input type="checkbox" class="riv-checkbox" value="${e.title}">
                    <span style="font-size: 0.8rem;">${e.title}</span>
                </label>
            `).join('');

            affiliationsPicker.innerHTML = entitiesList || '<span style="font-size: 0.8rem; color: var(--muted); padding: 0.5rem;">No entities available.</span>';
            rivalriesPicker.innerHTML = rivalriesList || '<span style="font-size: 0.8rem; color: var(--muted); padding: 0.5rem;">No entities available.</span>';

            const events = allRecords.filter(r => r.entity_type === 'Event');
            eventPicker.innerHTML = events.length ? events.map(e => `
                <label style="display: flex; align-items: center; gap: 0.5rem; text-transform: none; font-weight: normal; cursor: pointer;">
                    <input type="checkbox" class="event-checkbox" value="${e.id}">
                    <span style="font-size: 0.8rem;">${e.title} (${e.id})</span>
                </label>
            `).join('') : '<span style="font-size: 0.8rem; color: var(--muted); padding: 0.5rem;">No events available to link.</span>';
        }

        function renderClients() {
            clientCountBadge.textContent = `${allClients.length} ACCOUNTS`;
            clientList.innerHTML = allClients.map(c => `
                <div class="client-item">
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <h4>${c.name}</h4>
                        <span class="access-key">${c.access_key}</span>
                    </div>
                    <div class="meta">
                        <span>REGIONS: ${c.allowed_regions.join(', ')}</span>
                        <span>TYPES: ${c.allowed_types.length} enabled</span>
                        <span style="color: ${new Date(c.expires_at) < new Date() ? 'var(--error)' : 'var(--success)'}">
                            EXPIRES: ${new Date(c.expires_at).toLocaleDateString()}
                        </span>
                    </div>
                    <div class="actions">
                        <button class="action-btn edit-btn" onclick="editClient('${c.id}')">EDIT ACCOUNT</button>
                        <button class="action-btn edit-btn" style="color: var(--success)" onclick="resetClientKey('${c.id}')">NEW KEY</button>
                        <button class="action-btn edit-btn" style="color: var(--muted)" onclick="viewClientLogs('${c.id}', '${c.name}')">ACTIVITY</button>
                        <button class="action-btn delete-btn" onclick="deleteClient('${c.id}')">REVOKE ACCESS</button>
                    </div>
                </div>
            `).join('');
            
            if (allClients.length === 0) {
                clientList.innerHTML = '<div style="text-align: center; color: var(--muted); padding: 3rem;">No client accounts generated.</div>';
            }
        }

        function renderRequests() {
            requestCountBadge.textContent = `${allRequests.length} REQUESTS`;
            requestList.innerHTML = allRequests.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).map(r => `
                <div class="request-item">
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <h4>${r.name}</h4>
                        <span style="font-size: 0.7rem; color: var(--muted);">${new Date(r.timestamp).toLocaleString()}</span>
                    </div>
                    <div class="sender-info">
                        <span>📧 ${r.email}</span>
                        <span>🏢 ${r.organization}</span>
                    </div>
                    <div class="message">${r.message || 'No specific requirements mentioned.'}</div>
                    <div class="actions">
                        <button class="action-btn delete-btn" onclick="deleteDemoRequest('${r.id}')">DISMISS REQUEST</button>
                    </div>
                </div>
            `).join('');
        }

        async function deleteDemoRequest(id) {
            if (!confirm('Dismiss this demo request?')) return;
            try {
                const res = await adminFetch(`/api/admin/demo-requests/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showStatus('Request dismissed', 'success');
                    fetchDemoRequests();
                }
            } catch (err) {
                showStatus('Failed to dismiss', 'error');
            }
        }

        async function deleteClient(id) {
            if (!confirm('Revoke access for this client? They will lose portal access immediately.')) return;
            try {
                const res = await adminFetch(`/api/admin/clients/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showStatus('Access revoked', 'success');
                    fetchClients();
                }
            } catch (err) {
                showStatus('Failed to revoke access', 'error');
            }
        }

        clientForm.onsubmit = async (e) => {
            e.preventDefault();
            const id = clientIdInput.value;
            const regions = Array.from(document.querySelectorAll('input[name="client-region"]:checked')).map(cb => cb.value);
            const types = Array.from(document.querySelectorAll('input[name="client-type"]:checked')).map(cb => cb.value);
            
            if (regions.length === 0 || types.length === 0) {
                alert('Please select at least one region and one entity type.');
                return;
            }

            const data = {
                name: document.getElementById('client-name').value,
                expiry_months: document.getElementById('client-expiry').value,
                allowed_regions: regions,
                allowed_types: types
            };

            const url = id ? `/api/admin/clients/${id}` : '/api/admin/clients';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await adminFetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    showStatus(id ? 'Client updated' : 'Client account created', 'success');
                    clearClientForm();
                    fetchClients();
                }
            } catch (err) {
                showStatus('Network error', 'error');
            }
        };

        function editClient(id) {
            const client = allClients.find(c => c.id === id);
            if (!client) return;

            clientIdInput.value = client.id;
            document.getElementById('client-name').value = client.name;
            
            // Note: Expiry is not easily reversible to "months" since it's a date now, 
            // but we'll leave it at whatever is selected for new saves if editing
            
            document.querySelectorAll('input[name="client-region"]').forEach(cb => {
                cb.checked = client.allowed_regions.includes(cb.value);
            });
            document.querySelectorAll('input[name="client-type"]').forEach(cb => {
                cb.checked = client.allowed_types.includes(cb.value);
            });

            clientFormTitle.textContent = 'EDIT CLIENT ACCOUNT';
            clientSaveBtn.textContent = 'UPDATE CLIENT';
            clientClearBtn.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function clearClientForm() {
            clientForm.reset();
            clientIdInput.value = '';
            clientFormTitle.textContent = 'CREATE CLIENT ACCOUNT';
            clientSaveBtn.textContent = 'GENERATE ACCESS KEY';
            clientClearBtn.style.display = 'none';
            renderTypePicker();
        }

        clientClearBtn.onclick = clearClientForm;

        async function resetClientKey(id) {
            const customKey = prompt('Enter a custom access key or leave blank to auto-generate:');
            if (customKey === null) return;

            try {
                const res = await adminFetch(`/api/admin/clients/${id}/reset-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ custom_key: customKey.trim() })
                });
                if (res.ok) {
                    showStatus('Access key updated', 'success');
                    fetchClients();
                }
            } catch (err) {
                showStatus('Failed to update key', 'error');
            }
        }

        async function viewClientLogs(id, name) {
            document.getElementById('modal-title').textContent = `ACTIVITY LOGS: ${name}`;
            const logOverlay = document.getElementById('log-overlay');
            const modalList = document.getElementById('modal-log-list');
            
            // Ensure we have latest logs
            await fetchAccessLogs();
            
            const filtered = allLogs.filter(l => l.client_id === id).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            modalList.innerHTML = filtered.map(l => {
                const badgeClass = l.action === 'Login' ? 'badge-login' : 'badge-access';
                return `
                    <div class="log-item" style="padding: 1rem; margin-bottom: 0.5rem;">
                        <div style="display: flex; justify-content: space-between;">
                            <span class="log-badge ${badgeClass}">${l.action}</span>
                            <span style="font-size: 0.7rem; color: var(--muted);">${new Date(l.timestamp).toLocaleString()}</span>
                        </div>
                        <div style="font-size: 0.8rem; margin-top: 0.5rem;">
                            Accessed: ${l.regions.join(', ') || 'None'}
                        </div>
                    </div>
                `;
            }).join('');

            if (filtered.length === 0) {
                modalList.innerHTML = '<div style="text-align: center; color: var(--muted); padding: 2rem;">No logs found for this client.</div>';
            }

            logOverlay.style.display = 'flex';
        }

        function closeLogModal() {
            document.getElementById('log-overlay').style.display = 'none';
        }

        function editRecord(id) {
            const record = allRecords.find(r => r.id === id);
            if (!record) return;

            recordIdInput.value = record.id;
            document.getElementById('title').value = record.title;
            document.getElementById('entity_type').value = record.entity_type;
            
            document.querySelectorAll('input[name="region"]').forEach(cb => {
                cb.checked = record.regions.includes(cb.value);
            });

            document.getElementById('tags').value = record.tags.join(', ');
            
            document.querySelectorAll('.aff-checkbox').forEach(cb => {
                cb.checked = record.affiliations?.includes(cb.value);
            });
            document.querySelectorAll('.riv-checkbox').forEach(cb => {
                cb.checked = record.rivalries?.includes(cb.value);
            });

            document.getElementById('summary').value = record.summary;
            
            const checkboxes = document.querySelectorAll('.event-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = record.linked_events?.includes(cb.value);
            });

            document.getElementById('save-btn').textContent = 'UPDATE RECORD';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteRecord(id) {
            if (!confirm('Delete this record?')) return;
            try {
                const res = await adminFetch(`/api/admin/records/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showStatus('Record deleted', 'success');
                    fetchRecords();
                }
            } catch (err) {
                showStatus('Failed to delete', 'error');
            }
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const id = recordIdInput.value;
            const linked_events = Array.from(document.querySelectorAll('.event-checkbox:checked')).map(cb => cb.value);
            const regions = Array.from(document.querySelectorAll('input[name="region"]:checked')).map(cb => cb.value);
            const affiliations = Array.from(document.querySelectorAll('.aff-checkbox:checked')).map(cb => cb.value);
            const rivalries = Array.from(document.querySelectorAll('.riv-checkbox:checked')).map(cb => cb.value);

            if (regions.length === 0) {
                alert('Please select at least one region.');
                return;
            }

            const data = {
                title: document.getElementById('title').value,
                entity_type: document.getElementById('entity_type').value,
                regions: regions,
                tags: document.getElementById('tags').value,
                affiliations: affiliations,
                rivalries: rivalries,
                summary: document.getElementById('summary').value,
                linked_events: linked_events
            };

            const url = id ? `/api/admin/records/${id}` : '/api/admin/ingest';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await adminFetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    showStatus(id ? 'Record updated' : 'Record ingested', 'success');
                    clearForm();
                    fetchRecords();
                }
            } catch (err) {
                showStatus('Network error', 'error');
            }
        };

        function clearForm() {
            form.reset();
            recordIdInput.value = '';
            document.getElementById('save-btn').textContent = 'SAVE RECORD';
        }

        document.getElementById('clear-btn').onclick = clearForm;
        filterInput.oninput = renderRecords;

        function showStatus(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.className = `status-${type}`;
            statusMsg.style.display = 'block';
            setTimeout(() => { statusMsg.style.display = 'none'; }, 4000);
        }

        fetchRecords();
    </script>
</body>
</html>
